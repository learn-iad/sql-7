<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1612">
  <title>SQL-тренажёр: OVER · PARTITION BY · LAG · LEAD</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{
      margin:0;min-height:100vh;min-height:100dvh;
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(22,101,52,.35) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 100%, rgba(21,128,61,.2) 0%, transparent 50%),
        #0a1612;
      color:#e2e8f0;
      display:flex;flex-direction:column;
      padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    }
    .app{flex:1;display:flex;flex-direction:column;max-width:1200px;width:100%;margin:0 auto;min-height:0;gap:10px}

    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-icon{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg,#14532d 0%,#166534 100%);
      border:1px solid rgba(74,222,128,.25);
      box-shadow:0 4px 16px rgba(22,101,52,.4);
      display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;
    }
    .brand h1{margin:0;font-size:1.05rem;font-weight:600;color:#f8fafc}
    .brand span{font-size:.78rem;color:#94a3b8;display:block;margin-top:1px}
    .progress-pill{
      font-size:.78rem;padding:6px 12px;border-radius:999px;
      background:rgba(15,40,30,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(74,222,128,.18);color:#cbd5e1;white-space:nowrap;
    }
    .progress-pill b{color:#4ade80}

    .task-card{
      background:rgba(15,40,30,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(74,222,128,.15);border-radius:14px;padding:14px 16px;
      box-shadow:0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .task-card.success{border-color:rgba(74,222,128,.45);background:linear-gradient(135deg,rgba(20,83,45,.55) 0%,rgba(15,40,30,.5) 100%)}
    .task-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:6px;font-weight:600}
    .task-card.success .task-label{color:#86efac}
    .task-text{margin:0;font-size:.95rem;line-height:1.55;color:#e2e8f0}
    .task-text b{color:#6ee7b7;font-weight:600}
    .task-text code{
      display:block;margin-top:8px;padding:10px 12px;border-radius:8px;
      background:rgba(8,18,14,.65);border:1px solid rgba(74,222,128,.12);
      font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:12px;color:#a7f3d0;line-height:1.5;white-space:pre-wrap;
    }

    .workspace{
      flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;
    }
    @media(max-width:860px){.workspace{grid-template-columns:1fr;grid-template-rows:auto auto}}

    .panel{
      display:flex;flex-direction:column;min-height:0;
      background:rgba(15,40,30,.4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(74,222,128,.12);border-radius:14px;overflow:hidden;
      box-shadow:0 8px 32px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .panel-head{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:8px 12px;background:rgba(10,22,18,.6);border-bottom:1px solid rgba(74,222,128,.1);flex-shrink:0;
    }
    .panel-title{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;display:flex;align-items:center;gap:6px}
    .panel-dot{width:8px;height:8px;border-radius:50%}
    .dot-editor{background:#22c55e}.dot-output{background:#fbbf24}.dot-schema{background:#34d399}

    .editor-wrap{flex:1;display:flex;min-height:220px;position:relative;overflow:hidden}
    .line-nums{
      padding:12px 0 12px 10px;font-family:"Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace;
      font-size:13px;line-height:1.55;color:#475569;text-align:right;user-select:none;min-width:36px;flex-shrink:0;
      background:rgba(8,18,14,.7);border-right:1px solid rgba(74,222,128,.08);overflow:hidden;
      white-space:pre;
    }
    .sql-input{
      flex:1;resize:none;border:none;outline:none;
      padding:12px 14px;margin:0;
      font-family:"Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace;
      font-size:13px;line-height:1.55;
      background:rgba(8,18,14,.7);color:#e2e8f0;tab-size:2;min-height:220px;
    }
    .sql-input::placeholder{color:#475569}

    .toolbar{
      display:flex;align-items:center;gap:8px;padding:8px 12px;
      border-top:1px solid rgba(74,222,128,.1);background:rgba(10,22,18,.6);flex-shrink:0;flex-wrap:wrap;
    }
    .btn-run{
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 18px;border:none;border-radius:8px;cursor:pointer;
      font-family:inherit;font-size:.88rem;font-weight:600;
      background:linear-gradient(135deg,#14532d 0%,#166534 100%);
      color:#fff;box-shadow:0 2px 12px rgba(22,101,52,.45);
      border:1px solid rgba(74,222,128,.2);
      transition:transform .15s,box-shadow .15s;
    }
    .btn-run:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(22,101,52,.55)}
    .btn-run:active{transform:translateY(0)}
    .btn-secondary{
      padding:7px 14px;border:1px solid rgba(74,222,128,.2);border-radius:8px;
      background:rgba(15,40,30,.4);color:#94a3b8;font-family:inherit;font-size:.82rem;cursor:pointer;
    }
    .btn-secondary:hover{border-color:rgba(74,222,128,.35);color:#cbd5e1}
    .hint-kbd{font-size:.75rem;color:#64748b;margin-left:auto}

    .output-body,.schema-body{
      flex:1;overflow:auto;padding:12px 14px;font-size:.88rem;line-height:1.5;min-height:120px;
      -webkit-overflow-scrolling:touch;
    }
    .output-body{font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:12.5px}
    .output-empty{color:#64748b;font-style:italic;font-family:"Segoe UI",system-ui,sans-serif}
    .msg{margin:0 0 8px;padding:8px 10px;border-radius:8px;border-left:3px solid}
    .msg-ok{background:rgba(5,46,22,.6);border-color:#22c55e;color:#bbf7d0}
    .msg-err{background:rgba(69,10,10,.6);border-color:#ef4444;color:#fecaca}
    .msg-info{background:rgba(20,83,45,.45);border-color:#4ade80;color:#bbf7d0}

    .schema-table{margin-bottom:12px;border:1px solid rgba(74,222,128,.12);border-radius:8px;overflow:hidden}
    .schema-table-name{
      padding:6px 10px;background:rgba(10,22,18,.6);font-weight:600;font-size:.82rem;color:#6ee7b7;
      border-bottom:1px solid rgba(74,222,128,.1);
    }
    .schema-cols{padding:0;margin:0;list-style:none}
    .schema-cols li{
      padding:5px 10px;font-family:Consolas,monospace;font-size:12px;
      border-bottom:1px solid rgba(74,222,128,.06);display:flex;gap:8px;align-items:baseline;
    }
    .schema-cols li:last-child{border-bottom:none}
    .col-name{color:#e2e8f0}.col-type{color:#86efac;font-size:11px}
    .col-pk{font-size:10px;background:rgba(20,83,45,.6);color:#fcd34d;padding:1px 5px;border-radius:4px}
    .data-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
    .data-table th,.data-table td{padding:5px 8px;border:1px solid rgba(74,222,128,.1);text-align:left;font-family:Consolas,monospace}
    .data-table th{background:rgba(10,22,18,.6);color:#86efac;font-weight:600;font-size:11px}
    .data-table td{color:#cbd5e1}
    .data-empty{padding:8px 10px;font-size:12px;color:#64748b;font-style:italic}

    .bottom-row{display:grid;grid-template-columns:1fr;gap:10px}
    @media(min-width:861px){.bottom-row{grid-column:1/-1}}

    .toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
      z-index:100;padding:12px 20px;border-radius:10px;font-size:.88rem;
      background:rgba(15,40,30,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      border:1px solid rgba(74,222,128,.2);color:#e2e8f0;
      box-shadow:0 8px 32px rgba(0,0,0,.4);
      opacity:0;visibility:hidden;transition:.25s;pointer-events:none;max-width:min(92vw,420px);text-align:center;
    }
    .toast.visible{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

    .modal-overlay{
      position:fixed;inset:0;background:rgba(10,22,18,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      z-index:200;display:none;align-items:center;justify-content:center;padding:16px;
    }
    .modal-overlay.visible{display:flex}
    .modal{
      background:rgba(15,40,30,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(74,222,128,.2);border-radius:16px;
      max-width:440px;width:100%;padding:28px 24px;text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .modal-icon{font-size:48px;margin-bottom:12px}
    .modal h2{margin:0 0 8px;font-size:1.25rem;color:#f8fafc}
    .modal p{margin:0 0 20px;color:#94a3b8;font-size:.92rem;line-height:1.5}
    .modal button{
      padding:10px 24px;border:none;border-radius:8px;cursor:pointer;
      font-family:inherit;font-size:.9rem;font-weight:600;
      background:linear-gradient(135deg,#14532d 0%,#166534 100%);color:#fff;
      border:1px solid rgba(74,222,128,.2);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">SQL</div>
        <div>
          <h1>Тренажёр SQL</h1>
          <span>OVER · PARTITION BY · LAG · LEAD</span>
        </div>
      </div>
      <div class="progress-pill" id="progressPill">Задание <b id="taskNum">1</b> из <b id="taskTotal">5</b></div>
    </header>

    <section class="task-card" id="taskCard">
      <div class="task-label" id="taskLabel">Задание 1</div>
      <p class="task-text" id="taskText"></p>
    </section>

    <div class="workspace">
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title"><span class="panel-dot dot-editor"></span>Редактор SQL</span>
        </div>
        <div class="editor-wrap">
          <div class="line-nums" id="lineNums">1</div>
          <textarea class="sql-input" id="sqlInput" spellcheck="false" placeholder="Напишите SQL-запрос…"></textarea>
        </div>
        <div class="toolbar">
          <button type="button" class="btn-run" id="btnRun">▶ Выполнить</button>
          <button type="button" class="btn-secondary" id="btnReset">Очистить</button>
          <span class="hint-kbd">Ctrl + Enter</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <span class="panel-title"><span class="panel-dot dot-output"></span>Результат выполнения</span>
        </div>
        <div class="output-body" id="outputBody">
          <p class="output-empty">Нажмите «Выполнить», чтобы запустить запрос и увидеть результат проверки.</p>
        </div>
      </div>

      <div class="panel bottom-row">
        <div class="panel-head">
          <span class="panel-title"><span class="panel-dot dot-schema"></span>Схема базы данных</span>
        </div>
        <div class="schema-body" id="schemaBody"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-overlay" id="modalComplete">
    <div class="modal">
      <div class="modal-icon">🎉</div>
      <h2>Отлично!</h2>
      <p>Вы освоили оконные функции: OVER, PARTITION BY, LAG и LEAD.</p>
      <button type="button" id="btnRestart">Пройти заново</button>
    </div>
  </div>

<script>
(function(){
  const sqlInput = document.getElementById('sqlInput');
  const lineNums = document.getElementById('lineNums');
  const outputBody = document.getElementById('outputBody');
  const schemaBody = document.getElementById('schemaBody');
  const taskCard = document.getElementById('taskCard');
  const taskLabel = document.getElementById('taskLabel');
  const taskText = document.getElementById('taskText');
  const taskNum = document.getElementById('taskNum');
  const taskTotal = document.getElementById('taskTotal');
  const btnRun = document.getElementById('btnRun');
  const btnReset = document.getElementById('btnReset');
  const toast = document.getElementById('toast');
  const modalComplete = document.getElementById('modalComplete');
  const btnRestart = document.getElementById('btnRestart');

  let taskStep = 0;
  let db = { tables: {} };
  let toastTimer = null;

  function cloneDb(src){
    const tables = {};
    for (const name of Object.keys(src.tables)) {
      const t = src.tables[name];
      tables[name] = {
        columns: t.columns.map(c => ({ ...c })),
        rows: (t.rows || []).map(r => ({ ...r }))
      };
    }
    return { tables };
  }

  function normalizeSql(sql){
    return sql.replace(/\s+/g, ' ').trim();
  }

  function stripComments(sql){
    return sql.replace(/--[^\n]*/g, ' ').replace(/\/\*[\s\S]*?\*\//g, ' ');
  }

  function splitByComma(str){
    const parts = [];
    let cur = '';
    let inQuote = false;
    let depth = 0;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (ch === "'" && !inQuote) { inQuote = true; cur += ch; continue; }
      if (ch === "'" && inQuote) {
        if (str[i + 1] === "'") { cur += "''"; i++; continue; }
        inQuote = false; cur += ch; continue;
      }
      if (!inQuote) {
        if (ch === '(') depth++;
        else if (ch === ')') depth--;
        else if (ch === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; continue; }
      }
      cur += ch;
    }
    if (cur.trim()) parts.push(cur.trim());
    return parts;
  }

  function parseSelectItem(item){
    item = item.trim();
    const asMatch = item.match(/^(.+?)\s+AS\s+["`]?(\w+)["`]?$/i);
    let expr = item, alias = null;
    if (asMatch) {
      expr = asMatch[1].trim();
      alias = asMatch[2].toLowerCase();
    } else {
      const bare = expr.replace(/["`]/g, '');
      if (/^[\w.]+$/.test(bare)) alias = bare.includes('.') ? bare.split('.').pop().toLowerCase() : bare.toLowerCase();
    }
    return { expr, alias };
  }

  function parseOrderBy(str){
    const items = [];
    for (const part of str.split(',')) {
      const m = part.trim().match(/^["`]?(\w+)["`]?(?:\s+(ASC|DESC))?$/i);
      if (!m) return null;
      items.push({ col: m[1].toLowerCase(), dir: (m[2] || 'ASC').toUpperCase() });
    }
    return items.length ? items : null;
  }

  function parseTableRef(str){
    const m = str.trim().match(/^["`]?(\w+)["`]?(?:\s+(?:AS\s+)?["`]?(\w+)["`]?)?$/i);
    if (!m) return null;
    const name = m[1].toLowerCase();
    const alias = (m[2] || m[1]).toLowerCase();
    return { name, alias };
  }

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const SYSDATE_VAL = new Date(2024, 7, 13, 15, 30, 45);

  function splitArgs(inner){
    const args = [];
    let cur = '', depth = 0, inQuote = false;
    for (let i = 0; i < inner.length; i++) {
      const ch = inner[i];
      if (ch === "'" && !inQuote) { inQuote = true; cur += ch; continue; }
      if (ch === "'" && inQuote) {
        if (inner[i + 1] === "'") { cur += "''"; i++; continue; }
        inQuote = false; cur += ch; continue;
      }
      if (!inQuote) {
        if (ch === '(') depth++;
        else if (ch === ')') depth--;
        else if (ch === ',' && depth === 0) { args.push(cur.trim()); cur = ''; continue; }
      }
      cur += ch;
    }
    if (cur.trim()) args.push(cur.trim());
    return args;
  }

  function extractCall(expr){
    const m = expr.match(/^(\w+)\s*\(/i);
    if (!m) return null;
    let depth = 0, start = expr.indexOf('(');
    for (let i = start; i < expr.length; i++) {
      if (expr[i] === '(') depth++;
      else if (expr[i] === ')') {
        depth--;
        if (depth === 0) {
          if (expr.slice(i + 1).trim()) return null;
          const inner = expr.slice(start + 1, i);
          return { name: m[1].toUpperCase(), args: splitArgs(inner) };
        }
      }
    }
    return null;
  }

  function unquoteStr(s){
    s = s.trim();
    if (s.startsWith("'") && s.endsWith("'")) return s.slice(1, -1).replace(/''/g, "'");
    return s;
  }

  function parseNlsNumeric(nlsStr){
    const m = nlsStr.match(/NLS_NUMERIC_CHARACTERS\s*=\s*'([^']*)'/i);
    const chars = m ? m[1] : '.,';
    return { decimal: chars[0] || '.', group: chars[1] || ',' };
  }

  function oracleToDate(str, mask){
    str = unquoteStr(String(str));
    mask = unquoteStr(mask);
    let si = 0, mi = 0;
    let y, mo, d, h = 0, miTime = 0, s = 0;
    while (mi < mask.length) {
      const rem = mask.slice(mi);
      if (rem.startsWith('YYYY')) {
        y = parseInt(str.slice(si, si + 4), 10); si += 4; mi += 4;
      } else if (rem.startsWith('HH24')) {
        h = parseInt(str.slice(si, si + 2), 10); si += 2; mi += 4;
      } else if (rem.startsWith('DD')) {
        d = parseInt(str.slice(si, si + 2), 10); si += 2; mi += 2;
      } else if (rem.startsWith('MM')) {
        mo = parseInt(str.slice(si, si + 2), 10); si += 2; mi += 2;
      } else if (rem.startsWith('MI')) {
        miTime = parseInt(str.slice(si, si + 2), 10); si += 2; mi += 2;
      } else if (rem.startsWith('SS')) {
        s = parseInt(str.slice(si, si + 2), 10); si += 2; mi += 2;
      } else if (str[si] === mask[mi]) {
        si++; mi++;
      } else {
        mi++;
      }
    }
    return new Date(y, mo - 1, d, h, miTime, s);
  }

  function looksLikeDate(val){
    if (val instanceof Date) return true;
    return typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val);
  }

  function asDate(val){
    if (val instanceof Date) return val;
    if (val == null) return null;
    const s = String(val);
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:\s+(\d{2}):(\d{2}):(\d{2}))?/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    return oracleToDate(s, 'YYYY-MM-DD');
  }

  function pad2(n){ return n < 10 ? '0' + n : String(n); }

  function oracleToChar(val, mask){
    let fm = false;
    mask = unquoteStr(mask);
    if (mask.startsWith('FM')) { fm = true; mask = mask.slice(2); }
    mask = mask;
    if (typeof val === 'number') {
      let pattern = mask.replace(/B/g, '');
      const hasSign = pattern.includes('S');
      pattern = pattern.replace(/S/g, '');
      const decIdx = pattern.indexOf('D');
      let intPart = pattern, decPart = '';
      if (decIdx >= 0) { intPart = pattern.slice(0, decIdx); decPart = pattern.slice(decIdx + 1); }
      const intWidth = (intPart.match(/9/g) || []).length + (intPart.match(/0/g) || []).length;
      const decWidth = (decPart.match(/9/g) || []).length + (decPart.match(/0/g) || []).length;
      let num = Math.abs(val);
      let intStr = decWidth ? String(Math.floor(num)) : String(Math.round(num));
      let decStr = '';
      if (decWidth) {
        decStr = String(Math.round((num - Math.floor(num)) * Math.pow(10, decWidth))).padStart(decWidth, '0');
      }
      if (!fm) intStr = intStr.padStart(intWidth, ' ');
      else intStr = intStr;
      let out = intStr;
      if (decWidth) out += '.' + decStr;
      if (hasSign && val < 0) out = '-' + out;
      return out;
    }
    const dt = asDate(val);
    if (!dt || isNaN(dt.getTime())) return null;
    let out = '';
    let i = 0;
    while (i < mask.length) {
      if (mask.startsWith('YYYY', i)) { out += dt.getFullYear(); i += 4; }
      else if (mask.startsWith('HH24', i)) { out += pad2(dt.getHours()); i += 4; }
      else if (mask.startsWith('DD', i)) { out += pad2(dt.getDate()); i += 2; }
      else if (mask.startsWith('MM', i)) { out += pad2(dt.getMonth() + 1); i += 2; }
      else if (mask.startsWith('MI', i)) { out += pad2(dt.getMinutes()); i += 2; }
      else if (mask.startsWith('SS', i)) { out += pad2(dt.getSeconds()); i += 2; }
      else if (mask.startsWith('Mon', i)) { out += MONTHS[dt.getMonth()]; i += 3; }
      else { out += mask[i]; i++; }
    }
    return out;
  }

  function oracleToNumber(str, mask, nlsStr){
    str = unquoteStr(String(str));
    mask = unquoteStr(mask).toUpperCase();
    const nls = parseNlsNumeric(nlsStr || '');
    let s = str;
    if (nls.group && nls.group !== ' ') s = s.split(nls.group).join('');
    if (nls.decimal !== '.') s = s.replace(nls.decimal, '.');
    s = s.replace(/[^\d.\-+]/g, '');
    const n = parseFloat(s);
    return isNaN(n) ? null : n;

  function evalDecode(args){

    if (rest.length % 2 === 1) return rest[rest.length - 1];

  function isWordChar(ch){

  function findMatchingParen(str, openIdx){

      if (ch === "'" && inQuote) {
        if (str[i + 1] === "'") { i++; continue; }
        inQuote = false; continue;
      }
      if (inQuote) continue;
      if (ch === '(') depth++;
      else if (ch === ')') {

  function findKeyword(str, kw){

    for (let i = 0; i <= str.length - kw.length; i++) {
      const ch = str[i];
      if (ch === "'" && !inQuote) { inQuote = true; continue; }
      if (ch === "'" && inQuote) {
        if (str[i + 1] === "'") { i++; continue; }
        inQuote = false; continue;
      }
      if (inQuote) continue;
      if (ch === '(') depth++;
      else if (ch === ')') depth--;
      if (depth !== 0) continue;
      if (str.slice(i, i + kw.length).toUpperCase() !== up) continue;
      if (i > 0 && isWordChar(str[i - 1])) continue;
      const after = str[i + kw.length];

  function stripOuterParens(expr){

  function extractWindowCalls(expr){

      const ch = expr[i];

        inQuote = false; continue;
      }
      if (inQuote) continue;

        if (expr[j] !== '(') continue;

        let k = i - 1;

        const argsClose = k;
        let depth = 1;
        k = argsClose - 1;
        for (; k >= 0; k--) {

  function rewriteWindowExpr(expr, collector){

  function compareOrderVals(av, bv){

      const da = asDate(av), db = asDate(bv);

  function compareRowsOrder(rowA, rowB, orderBy){

  function computeWindowValues(rows, spec){

    for (const idxs of groups.values()) {

  function splitLinear(expr, ops){

      if (ch === "'" && !inQuote) { inQuote = true; cur += ch; continue; }
      if (ch === "'" && inQuote) {
        if (expr[i + 1] === "'") { cur += "''"; i++; continue; }
        inQuote = false; cur += ch; continue;
      }
      if (!inQuote) {
        if (ch === '(') depth++;
        else if (ch === ')') depth--;

          const unary = (ch === '+' || ch === '-') && cur.trim() === '';
          if (!unary) {
            parts.push({ op: pendingOp, term: cur.trim() });
            pendingOp = ch;
            cur = '';
            continue;
          }

  function applyOp(op, a, b){

    if (op === '-') return na - nb;

      if (call.name === 'TO_CHAR') return oracleToChar(args[0], args[1]);
      if (call.name === 'TO_NUMBER') return oracleToNumber(args[0], args[1], args[2]);

    const col = expr.replace(/["`]/g, '').toLowerCase();

    if (ctx && ctx.columns && ctx.columns.includes(col)) return row ? row[col] : undefined;

    if (expr.includes('||')) {
      return splitConcat(expr).map(p => {
        const v = evalExpr(p, row, ctx);

      }).join('');

  function parseWhereCond(str){

  function findOpOutsideQuotes(str, op){

  function compareVals(a, b, op){

      a = a == null ? null : Number(a);
      b = b == null ? null : Number(b);
    }
    if (a == null || b == null) {
      if (op === '=') return a == null && b == null;
      if (op === '<>') return a != null || b != null;
      return false;
    }
    switch (op) {
      case '=': return a == b;
      case '<>': return a != b;
      case '>': return a > b;
      case '<': return a < b;

      case '<=': return a <= b;

      return total;
    }
    return null;
  }

  function executeSql(dbState, sql){
    const messages = [];
    const cleaned = normalizeSql(stripComments(sql));
    if (!cleaned) {
      messages.push({ type: 'err', text: 'Пустой запрос. Введите SQL-команду.' });
      return { ok: false, messages };
    }

    const stmts = cleaned.split(';').map(s => s.trim()).filter(Boolean);
    if (stmts.length !== 1) {
      messages.push({ type: 'err', text: 'Выполните один SELECT-запрос за раз.' });
      return { ok: false, messages };
    }

    const stmt = stmts[0];
    const selectMatch = stmt.match(/^SELECT\s+(DISTINCT\s+)?(.+)\s+FROM\s+(.+)$/i);
    if (!selectMatch) {
      messages.push({ type: 'err', text: 'Неподдерживаемая команда. Доступен SELECT с оконными функциями OVER, PARTITION BY, LAG и LEAD.' });
      return { ok: false, messages };

    const distinct = !!selectMatch[1];
    let rest = selectMatch[3].trim();
    let orderByStr = null;
    const orderMatch = rest.match(/\s+ORDER\s+BY\s+(.+)$/i);
    if (orderMatch) {

    if (!tableRef) {
      messages.push({ type: 'err', text: 'Ошибка: не удалось разобрать FROM.' });

    let sourceRows;
    if (tableRef.name === 'dual') {
      sourceRows = [{}];
    } else {
      const table = dbState.tables[tableRef.name];
      if (!table) {
        messages.push({ type: 'err', text: 'Ошибка: таблица «' + tableRef.name + '» не найдена.' });
        return { ok: false, messages };
      }
      sourceRows = table.rows.map(r => {
        const out = {};
        for (const c of table.columns) out[c.name] = r[c.name];
        return out;
      });
    }

    if (whereStr) {
      const cond = parseWhereCond(whereStr);
      if (!cond) {
        messages.push({ type: 'err', text: 'Ошибка: не удалось разобрать условие WHERE.' });
        return { ok: false, messages };
      }
      try {
        sourceRows = sourceRows.filter(row => {
          const lv = evalExpr(cond.left, row, {});
          const rv = evalExpr(cond.right, row, {});
          return compareVals(lv, rv, cond.op);

    const items = splitByComma(selectMatch[2]).map(parseSelectItem);
    if (!items.length) {
      messages.push({ type: 'err', text: 'Ошибка: укажите столбцы после SELECT.' });
      return { ok: false, messages };
    }

    const hasAgg = items.some(it => isAggregateExpr(it.expr));
    const outCols = [];
    const projectors = [];
    let projectRows = sourceRows;

    try {
      const winCollector = [];
      const rewrittenItems = items.map(it => ({
        alias: it.alias,
        expr: rewriteWindowExpr(it.expr, winCollector)

      const winValues = winCollector.map(w => computeWindowValues(sourceRows, w));
      projectRows = sourceRows.map((row, ri) => {
        const copy = {};

            projectors.push(() => val);
          } else {
            messages.push({ type: 'err', text: 'С агрегатом SUM используйте только агрегатные выражения.' });
            return { ok: false, messages };
          }
        }
        projectRows = [{}];
      } else {
        for (const it of rewrittenItems) {
          const col = it.alias;
          if (!col) {
            messages.push({ type: 'err', text: 'Укажите alias через AS для выражений: ' + it.expr });
            return { ok: false, messages };
          }
          outCols.push(col);
          projectors.push(row => evalExpr(it.expr, row, {}));
        }
      }
    } catch (e) {
      messages.push({ type: 'err', text: 'Ошибка в SELECT: ' + e.message });
      return { ok: false, messages };
    }

    let resultRows = projectRows.map(row => {
      const out = {};
      outCols.forEach((name, i) => { out[name] = projectors[i](row); });
      return out;
    });

    if (orderByStr) {
      const orderItems = parseOrderBy(orderByStr);
      if (!orderItems) {
        messages.push({ type: 'err', text: 'Ошибка: не удалось разобрать ORDER BY.' });
        return { ok: false, messages };
      }
      resultRows = resultRows.slice().sort((a, b) => {
        for (const o of orderItems) {
          const av = a[o.col], bv = b[o.col];
          let cmp = 0;
          if (av == null && bv == null) cmp = 0;
          else if (av == null) cmp = 1;
          else if (bv == null) cmp = -1;
          else if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
          else cmp = String(av).localeCompare(String(bv), 'ru');
          if (cmp !== 0) return o.dir === 'DESC' ? -cmp : cmp;
        }
        return 0;
      });
    }

    if (distinct) {
      const seen = new Set();
      resultRows = resultRows.filter(row => {
        const key = outCols.map(c => String(row[c])).join('\0');
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    const resultSet = { columns: outCols, rows: resultRows };
    messages.push({ type: 'ok', text: 'Выбрано строк: ' + resultRows.length + '.' });
    return { ok: true, messages, resultSet };
  }

  const CLAIM_COLS = [

  const CLAIMS = [

  function makeClaimsDb(){
    return {
      tables: {

      }

  }
  function makePoliciesDb(){

  function sameVal(a, b){
    if (a == null && b == null) return true;
    if (a == null || b == null) return false;
    if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) < 0.001;
    return a === b || String(a) === String(b);
  }

  function cellKey(v){
    return v == null ? '\0NULL\0' : String(v);
  }

  function matchResult(resultSet, expected, opts){
    if (!resultSet) return { pass: false, hint: 'Выполните SELECT-запрос.' };
    const cols = resultSet.columns.map(c => c.toLowerCase());
    const expCols = expected.columns.map(c => c.toLowerCase());
    if (cols.length !== expCols.length || cols.some((c, i) => c !== expCols[i])) {
      return { pass: false, hint: 'Ожидаемые столбцы: ' + expected.columns.join(', ') + '.' };
    }
    if (resultSet.rows.length !== expected.rows.length) {
      return { pass: false, hint: 'Ожидается строк: ' + expected.rows.length + ', получено: ' + resultSet.rows.length + '.' };
    }
    const ordered = !opts || opts.ordered !== false;
    if (ordered) {
      for (let i = 0; i < expected.rows.length; i++) {
        for (let j = 0; j < expCols.length; j++) {
          if (!sameVal(resultSet.rows[i][resultSet.columns[j]], expected.rows[i][j])) {
            return { pass: false, hint: opts && opts.hint ? opts.hint : 'Результат не совпадает с ожидаемым. Проверьте тип JOIN и условие.' };
          }
        }
      }
    } else {
      const keyOf = row => expCols.map((_, j) => cellKey(row[resultSet.columns[j]])).join('\0');
      const got = resultSet.rows.map(keyOf).sort();
      const exp = expected.rows.map(r => r.map(cellKey).join('\0')).sort();
      if (got.some((k, i) => k !== exp[i])) {
        return { pass: false, hint: opts && opts.hint ? opts.hint : 'Набор строк не совпадает с ожидаемым.' };
      }
    }
    return { pass: true };
  }

  const OVER_ROWS = [
    [1, 101, 10000, 50000, 20],
    [2, 102, 30000, 50000, 60],
    [4, 103, 10000, 50000, 20]
  ];
  const PART_ROWS = [
    ['Москва', 'КАСКО', 101, 50000, (50000 + 8000 + 40000) / 3, 1, 51.02],
    ['Москва', 'КАСКО', 103, 40000, (50000 + 8000 + 40000) / 3, 2, 91.84],
    ['Москва', 'ОСАГО', 102, 8000, (50000 + 8000 + 40000) / 3, 1, 100],
    ['СПб', 'КАСКО', 105, 45000, 40000, 1, 56.25],
    ['СПб', 'КАСКО', 104, 35000, 40000, 2, 100]
  ];
  const LAG_ROWS = [
    [101, '2024-01-10', 20, null, 0, 'Стабильный'],
    [101, '2024-04-10', 35, 20, 15, 'Стабильный'],
    [101, '2024-07-10', 50, 35, 15, 'Растущий риск ⚠️'],
    [102, '2024-02-01', 40, null, 0, 'Стабильный'],
    [102, '2024-05-01', 38, 40, -2, 'Стабильный']
  ];
  const LEAD_ROWS = [
    [101, '2024-01-15', 10000, 1, '2024-02-15', 10000, 'Регулярные платежи', 0],
    [101, '2024-02-15', 10000, 1, '2024-04-20', 12000, 'Большой разрыв - возможны проблемы', 20],
    [101, '2024-04-20', 12000, 1, null, null, 'Последний платеж - риск оттока!', 0],
    [102, '2024-03-01', 5000, 2, null, null, 'Последний платеж - риск оттока!', 0]
  ];

  const TASKS = [
    {
      id: 'over',
      label: 'OVER',
      text: 'В таблице <b>insurance_claims</b> посчитайте долю каждой выплаты. Выведите <b>claim_id</b>, <b>client_id</b>, <b>claim_amount</b>, общую сумму всех выплат <b>total_all_claims</b> через <b>SUM(...) OVER ()</b> и долю в процентах <b>percent_of_total</b> (округлите до 2 знаков). Учитывайте только выплаты с <b>claim_date &gt;= \'2024-01-01\'</b>. Отсортируйте по <b>claim_id</b>.',
      initDb: () => makeClaimsDb(),
      check(dbState, result){
        return matchResult(result && result.resultSet, {
          columns: ['claim_id', 'client_id', 'claim_amount', 'total_all_claims', 'percent_of_total'],
          rows: OVER_ROWS
        }, { ordered: true, hint: 'SUM(claim_amount) OVER () AS total_all_claims и ROUND(claim_amount * 100.0 / SUM(claim_amount) OVER (), 2)' });
      }
    },
    {
      id: 'partition',
      label: 'PARTITION BY',
      text: 'По активным полисам (<b>policy_status = \'ACTIVE\'</b>) из <b>insurance_policies</b> выведите <b>region</b>, <b>policy_type</b>, <b>client_id</b>, <b>premium_amount</b>, среднюю премию по региону <b>avg_regional_premium</b>, ранг премии внутри типа полиса в регионе <b>premium_rank</b> (по убыванию суммы) и накопительный процент <b>cumulative_percent</b> в регионе (округление до 2 знаков). Отсортируйте по <b>region</b>, затем по <b>premium_amount</b> по убыванию.',
      initDb: () => makePoliciesDb(),
      check(dbState, result){
        return matchResult(result && result.resultSet, {
          columns: ['region', 'policy_type', 'client_id', 'premium_amount', 'avg_regional_premium', 'premium_rank', 'cumulative_percent'],
          rows: PART_ROWS
        }, { ordered: true, hint: 'AVG(...) OVER (PARTITION BY region), RANK() OVER (PARTITION BY region, policy_type ORDER BY premium_amount DESC)' });
      }
    },
    {
      id: 'lag',
      label: 'LAG',
      text: 'По таблице <b>client_risk_assessments</b> выведите <b>client_id</b>, <b>assessment_date</b>, <b>risk_score</b>, предыдущий балл <b>prev_risk_score</b>, изменение <b>risk_change</b> (для первой оценки — 0) и тренд <b>risk_trend</b>: «Растущий риск ⚠️», если балл растёт два периода подряд, иначе «Стабильный». Разбивка по клиенту, сортировка по дате. Отсортируйте результат по <b>client_id</b>, <b>assessment_date</b>.',
      initDb: () => makeRisksDb(),
      check(dbState, result){
        return matchResult(result && result.resultSet, {
          columns: ['client_id', 'assessment_date', 'risk_score', 'prev_risk_score', 'risk_change', 'risk_trend'],
          rows: LAG_ROWS
        }, { ordered: true, hint: 'LAG(risk_score, 1) OVER (PARTITION BY client_id ORDER BY assessment_date) и LAG(..., 1, risk_score) для risk_change' });
      }
    },
    {
      id: 'lead',
      label: 'LEAD',
      text: 'По платежам из <b>insurance_payments</b> за последние 12 месяцев выведите <b>client_id</b>, <b>payment_date</b>, <b>payment_amount</b>, <b>policy_id</b>, дату и сумму следующего платежа <b>next_payment</b> и <b>next_amount</b>, шаблон <b>payment_pattern</b> («Последний платеж - риск оттока!», если следующего нет; «Большой разрыв - возможны проблемы», если разрыв больше 40 дней; иначе «Регулярные платежи») и изменение суммы <b>next_payment_change_pct</b> в процентах (округление до 2 знаков). Отсортируйте по <b>client_id</b>, <b>payment_date</b>.',
      initDb: () => makePaymentsDb(),
      check(dbState, result){
        return matchResult(result && result.resultSet, {
          columns: ['client_id', 'payment_date', 'payment_amount', 'policy_id', 'next_payment', 'next_amount', 'payment_pattern', 'next_payment_change_pct'],
          rows: LEAD_ROWS
        }, { ordered: true, hint: 'LEAD(payment_date, 1) OVER (PARTITION BY client_id ORDER BY payment_date) и CASE по следующему платежу' });
      }
    }
  ];

  const COMPLETE_TEXT = 'Все задания выполнены! Вы освоили оконные функции OVER, PARTITION BY, LAG и LEAD.';

  taskTotal.textContent = String(TASKS.length);

  function updateLineNums(){
    const lines = sqlInput.value.split('\n').length || 1;
    lineNums.textContent = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
  }

  function formatCell(v){
    if (v == null) return '';
    if (v instanceof Date && !isNaN(v.getTime())) {
      return v.getFullYear() + '-' + pad2(v.getMonth() + 1) + '-' + pad2(v.getDate());
    }
    return String(v);
  }

  function renderResultTable(resultSet){
    if (!resultSet || !resultSet.columns.length) return '';
    const ths = resultSet.columns.map(c => '<th>' + escapeHtml(c) + '</th>').join('');
    const trs = resultSet.rows.length
      ? resultSet.rows.map(row => {
          const tds = resultSet.columns.map(c => '<td>' + escapeHtml(formatCell(row[c])) + '</td>').join('');
          return '<tr>' + tds + '</tr>';
        }).join('')
      : '<tr><td colspan="' + resultSet.columns.length + '" style="color:#64748b;font-style:italic">Нет строк</td></tr>';
    return '<table class="data-table"><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table>';
  }

  function renderOutput(messages, checkResult, resultSet){
    if (!messages.length && !checkResult && !resultSet) {
      outputBody.innerHTML = '<p class="output-empty">Нажмите «Выполнить», чтобы запустить запрос и увидеть результат проверки.</p>';
      return;
    }
    let html = '';
    for (const m of messages) {
      html += '<p class="msg msg-' + m.type + '">' + escapeHtml(m.text) + '</p>';
    }
    if (resultSet) html += renderResultTable(resultSet);
    if (checkResult) {
      if (checkResult.pass) {
        html += '<p class="msg msg-ok">✓ Задание выполнено верно!</p>';
      } else if (checkResult.hint) {
        html += '<p class="msg msg-info">Подсказка: ' + escapeHtml(checkResult.hint) + '</p>';
      }
    }
    outputBody.innerHTML = html;
  }

  function renderSchema(){
    const names = Object.keys(db.tables).sort();
    if (!names.length) {
      schemaBody.innerHTML = '<p class="output-empty">Нет данных.</p>';
      return;
    }
    schemaBody.innerHTML = names.map(name => {
      const table = db.tables[name];
      const cols = table.columns;
      const lis = cols.map(c => {
        let badges = '';
        if (c.pk) badges += '<span class="col-pk">PK</span>';
        return '<li><span class="col-name">' + escapeHtml(c.name) + '</span><span class="col-type">' + escapeHtml(c.type) + '</span>' + badges + '</li>';
      }).join('');
      let dataHtml = '';
      if (!table.rows.length) {
        dataHtml = '<p class="data-empty">Нет строк</p>';
      } else {
        const ths = cols.map(c => '<th>' + escapeHtml(c.name) + '</th>').join('');
        const trs = table.rows.map(row => {
          const tds = cols.map(c => '<td>' + escapeHtml(row[c.name] == null ? '' : row[c.name]) + '</td>').join('');
          return '<tr>' + tds + '</tr>';
        }).join('');
        dataHtml = '<table class="data-table"><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table>';
      }
      return '<div class="schema-table"><div class="schema-table-name">' + escapeHtml(name) + '</div><ul class="schema-cols">' + lis + '</ul>' + dataHtml + '</div>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(text){
    toast.textContent = text;
    toast.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('visible'), 2800);
  }

  function initTask(step){
    const task = TASKS[step];
    if (!task) return;
    db = task.initDb ? task.initDb(db) : { tables: {} };
    sqlInput.value = '';
    updateLineNums();
    renderSchema();
    renderOutput([], null);
  }

  function updateBanner(){
    taskCard.classList.remove('success');
    if (taskStep >= TASKS.length) {
      taskLabel.textContent = 'Готово';
      taskText.innerHTML = COMPLETE_TEXT;
      taskCard.classList.add('success');
      taskNum.textContent = String(TASKS.length);
      return;
    }
    const t = TASKS[taskStep];
    taskLabel.textContent = t.label;
    taskText.innerHTML = t.text;
    taskNum.textContent = String(taskStep + 1);
  }

  function runQuery(){
    if (taskStep >= TASKS.length) return;
    const task = TASKS[taskStep];
    const snapshot = cloneDb(db);
    const result = executeSql(db, sqlInput.value);
    renderSchema();

    let checkResult = null;
    if (result.ok) {
      checkResult = task.check(db, result);
      if (checkResult.pass) {
        taskStep++;
        updateBanner();
        if (taskStep >= TASKS.length) {
          renderOutput(result.messages, checkResult, result.resultSet);
          modalComplete.classList.add('visible');
          return;
        }
        showToast('Задание выполнено — переходите к следующему.');
        initTask(taskStep);
        renderOutput(result.messages, checkResult, result.resultSet);
        return;
      }
      db = snapshot;
      renderSchema();
    }

    renderOutput(result.messages, checkResult, result.resultSet);
  }

  function clearEditor(){
    if (taskStep >= TASKS.length) return;
    sqlInput.value = '';
    updateLineNums();
  }

  function restartAll(){
    taskStep = 0;
    modalComplete.classList.remove('visible');
    updateBanner();
    initTask(0);
  }

  sqlInput.addEventListener('input', updateLineNums);
  sqlInput.addEventListener('scroll', () => { lineNums.scrollTop = sqlInput.scrollTop; });
  sqlInput.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = sqlInput.selectionStart;
      sqlInput.value = sqlInput.value.slice(0, start) + '  ' + sqlInput.value.slice(sqlInput.selectionEnd);
      sqlInput.selectionStart = sqlInput.selectionEnd = start + 2;
      updateLineNums();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runQuery();
    }
  });

  btnRun.addEventListener('click', runQuery);
  btnReset.addEventListener('click', clearEditor);
  btnRestart.addEventListener('click', restartAll);
  modalComplete.addEventListener('click', e => {
    if (e.target === modalComplete) modalComplete.classList.remove('visible');
  });

  updateBanner();
  initTask(0);
})();
